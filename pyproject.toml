[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strathex"
dynamic = ["version"]
description = "STRATHMARK-powered woodchopping handicap and tournament management system"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alex Kaper" }]
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "requests",
    "cryptography>=50.0.2,<51",
    # STRATHMARK is the handicap calculation engine, released under the Apache License 2.0.
    # License compatibility: STRATHEX is MIT and Apache 2.0 is a compatible permissive license.
    # V2 is published on PyPI; retain the reviewed Git source pin for the
    # exact v2.0.0 release commit used by direct-Python and HTTP parity tests.
    "strathmark @ git+https://github.com/SquirmyWormy275/STRATHMARK.git@a231ad65fe82317516cc82a282761d73adb0c0e3",
]

[project.scripts]
strathex = "strathex_cli:main"

[project.optional-dependencies]
llm = [
    "requests",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.16.5",
]
api-test = [
    # Exact versions exercised by the direct/HTTP parity gate. STRATHMARK itself
    # remains pinned above; these packages activate its optional FastAPI surface.
    "fastapi==0.142.2",
    "starlette==1.7.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
]

[tool.hatch.metadata]
# Required so the strathmark git+https direct reference in dependencies is allowed.
allow-direct-references = true

[tool.hatch.version]
path = "woodchopping/__init__.py"

[tool.hatch.build.targets.sdist]
# Operator history is an input, not a public release asset.
exclude = ["/woodchopping.xlsx", "/woodchopping_clean.xlsx"]

[tool.hatch.build.targets.wheel]
only-include = [
    "woodchopping",
    "config.py",
    "explanation_system_functions.py",
    "MainProgramV5_2.py",
    "strathex_cli.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ollama: tests that require a local Ollama instance (skipped in CI)",
    "strathmark: tests that exercise the strathmark engine directly",
]

[tool.coverage.run]
source = ["woodchopping"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"
line-length = 120
# Historical Markdown examples are documentation, not Python source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line too long) is reported but we tolerate it pragmatically — many CLI
# print/help strings are intentionally long. Bumping line-length to 120 catches
# the worst offenders without forcing widespread reflowing of judge-facing text.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files commonly re-export symbols.
"__init__.py" = ["F401"]
# Test scripts and benchmark scripts frequently manipulate sys.path before
# importing project modules — E402 is expected.
"tests/**/*.py" = ["E402", "F401", "F841"]
# Optional ML backends (xgboost and sklearn) are imported inside
# try/except ImportError blocks as availability sentinels. Ruff cannot tell
# they gate downstream code paths.
"woodchopping/predictions/ml_model.py" = ["F401"]
