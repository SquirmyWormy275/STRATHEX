name: Apply Boundary Formatting

on:
  push:
    branches:
      - agent/fix-strathmark-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-strathmark-boundary
          fetch-depth: 0

      - name: Apply Ruff-equivalent layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('woodchopping/strathmark_adapter.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''        positions = [
              position
              for alias in aliases
              for position, name in enumerate(normalized_names)
              if name == alias
          ]''',
              '''        positions = [position for alias in aliases for position, name in enumerate(normalized_names) if name == alias]''',
          )
          text = text.replace(
              '''    consumed_positions = {
              position for positions in collisions.values() for position in positions
          }''',
              '''    consumed_positions = {position for positions in collisions.values() for position in positions}''',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- woodchopping/strathmark_adapter.py; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add woodchopping/strathmark_adapter.py
          git commit -m "style: format STRATHMARK boundary fix"
          git push origin HEAD:agent/fix-strathmark-boundary
