name: Reconstruct Adapter Source

on:
  push:
    branches:
      - agent/fix-strathmark-boundary

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-strathmark-boundary
          fetch-depth: 0

      - name: Restore exact adapter bytes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payload = Path('.maintenance/strathmark_adapter.py.gz.b64').read_text(encoding='utf-8').strip()
          content = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(content).hexdigest()
          expected = 'e7e879a57e5a6d43a09381cafaf4dd8a1c454589b873d6633565622ac127a09e'
          if digest != expected:
              raise SystemExit(f'Adapter checksum mismatch: {digest}')
          Path('woodchopping/strathmark_adapter.py').write_bytes(content)
          PY

      - name: Commit restored adapter
        shell: bash
        run: |
          if git diff --quiet -- woodchopping/strathmark_adapter.py; then
            echo "Adapter already matches the expected source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add woodchopping/strathmark_adapter.py
          git commit -m "fix: restore exact STRATHMARK boundary source"
          git push origin HEAD:agent/fix-strathmark-boundary
