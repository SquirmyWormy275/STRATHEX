name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Check documentation links
        run: python scripts/check_docs.py

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,api-test]"

      - name: Run pytest (skip Ollama-dependent tests)
        env:
          STRATHMARK_TEST_DB: "1"
          STRATHMARK_DB_PATH: ${{ runner.temp }}/strathex-v2.sqlite3
          STRATHMARK_V3_DB_PATH: ${{ runner.temp }}/strathex-v3.sqlite3
          STRATHEX_PREDICTION_AUTHORITY_DB: ${{ runner.temp }}/strathex-authority.sqlite3
          STRATHEX_V3_COMMAND_DB: ${{ runner.temp }}/strathex-commands.sqlite3
        run: pytest tests/ -v --tb=short -m "not ollama" --cov=woodchopping --cov-report=term-missing --basetemp=${{ runner.temp }}/strathex-pytest -p no:cacheprovider

  build:
    name: Installed app (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install build
        run: pip install build openpyxl

      - name: Build distribution
        run: python -m build

      - name: Start and exit installed app outside checkout
        run: python scripts/smoke_installed_app.py --wheel dist/strathex-7.3.0-py3-none-any.whl

  v3_pair:
    name: Installed V3 pair (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out exact reviewed V3 service fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SquirmyWormy275/STRATHMARK
          ref: 8a1d40aa5645715f9ab876d0517b64c36602a77e
          path: .tmp/service-source

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build both distributions
        shell: bash
        run: |
          python -m pip install build
          python -m build --outdir .tmp/consumer-dist
          python -m build .tmp/service-source --outdir .tmp/service-dist

      - name: Exercise installed client and service over loopback
        run: >-
          python scripts/smoke_v3_pair.py
          --service-checkout .tmp/service-source
          --service-source 8a1d40aa5645715f9ab876d0517b64c36602a77e
          --consumer-wheel .tmp/consumer-dist/strathex-7.3.0-py3-none-any.whl
          --service-wheel .tmp/service-dist/strathmark-3.0.0rc3-py3-none-any.whl
          --output .tmp/installed-v3-pair.json
          --with-local-numerics

  linux_competition:
    name: Installed Linux competition (${{ matrix.os }} / Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out reviewed local competition runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SquirmyWormy275/STRATHMARK
          ref: ef73fa411be4b26262225c0de3f5a6948ecd2823
          path: .tmp/linux-service-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and install separate exact wheels
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir .tmp/linux-consumer-dist
          python -m build .tmp/linux-service-source --wheel --outdir .tmp/linux-service-dist
          python -m venv .tmp/linux-consumer
          python -m venv .tmp/linux-producer
          if [ "$RUNNER_OS" = "Windows" ]; then
            consumer=.tmp/linux-consumer/Scripts/python.exe
            producer=.tmp/linux-producer/Scripts/python.exe
          else
            consumer=.tmp/linux-consumer/bin/python
            producer=.tmp/linux-producer/bin/python
          fi
          "$consumer" -m pip install .tmp/linux-consumer-dist/strathex-7.3.0-py3-none-any.whl
          "$producer" -m pip install -r .tmp/linux-service-source/requirements/v3-release.lock ".tmp/linux-service-dist/strathmark-3.0.0rc4-py3-none-any.whl[v3-candidate]"
          "$producer" -I -m strathmark.v3.factory.synthetic_fixture --output .tmp/linux-synthetic-model
          "$consumer" scripts/smoke_linux_competition.py --v3-python "$producer" --ml-bundle .tmp/linux-synthetic-model/ml-bundle --output .tmp/linux-competition-smoke

  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, build, v3_pair, linux_competition]
    if: always()
    steps:
      - name: Require every maintenance gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          V3_PAIR_RESULT: ${{ needs.v3_pair.result }}
          LINUX_COMPETITION_RESULT: ${{ needs.linux_competition.result }}
        run: test "$LINT_RESULT" = success && test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success && test "$V3_PAIR_RESULT" = success && test "$LINUX_COMPETITION_RESULT" = success
